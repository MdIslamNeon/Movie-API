<!DOCTYPE html>
<html lang="en">

<head>

  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="index.css">
  <script src="https://kit.fontawesome.com/d3aa9f2eac.js" crossorigin="anonymous"></script>
  <title>Movies</title>
</head>

<body>
    <header class="site-header">
        <div class="header-container">
            <a href="#" class="logo">OMDb API</a>
            <nav class="nav-menu">
                <a href="#" class="nav-link">Home</a>
                <a href="#" class="nav-link">Find your movie</a>
                <a href="#" class="btn-contact">Contact</a>
            </nav>
        </div>

    <div class="search-container">
        <input class="search-input" type="text" placeholder="Search by Name or ID">

      </div>

  </div>
